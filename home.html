<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouvel onglet</title>
<style>
:root{
  --bg:#08080a; --bg2:#0e0e12; --card:#141418; --card2:#1a1a20; --line:#26262d; --text:#f4f2ee; --sub:#8f8d96;
  --accent:#d669d2; --accent-text:#08080a; --live:#ff3b3b; --glow:rgba(214,105,210,.10);
  --head:"Bahnschrift","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
}
body.dark{ --bg:#1b1c1f; --bg2:#1f2023; --card:#2b2c30; --card2:#323337; --line:#3c4043; --text:#e8eaed; --sub:#9aa0a6;
  --accent:#8ab4f8; --accent-text:#202124; --glow:rgba(138,180,248,.06); }
body.light{ --bg:#f3f4f6; --bg2:#eceef1; --card:#ffffff; --card2:#f6f7f9; --line:#e2e4e8; --text:#1f1f1f; --sub:#5f6368;
  --accent:#1a73e8; --accent-text:#ffffff; --glow:rgba(26,115,232,.05); }

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  background-image:radial-gradient(1200px 500px at 20% -10%,var(--glow),transparent 60%),
                   repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.012) 22px 23px);
  transition:background-color .2s,color .2s}
body.light{background-image:radial-gradient(1200px 500px at 20% -10%,var(--glow),transparent 60%)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:34px 28px 70px}

/* ---- En-tête ---- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.badge{font-family:var(--head);font-weight:700;font-size:22px;letter-spacing:.5px;padding:6px 12px;border:2px solid var(--text);border-radius:10px;line-height:1}
.brand-name{font-family:var(--head);font-weight:700;font-size:30px;letter-spacing:4px;text-transform:uppercase}
.brand-sub{color:var(--sub);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.when{text-align:right}
.clock{font-family:var(--head);font-size:64px;font-weight:300;line-height:.9;letter-spacing:-1px}
.date{color:var(--sub);font-size:14px;margin-top:8px}
.quick{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.qb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;transition:color .12s,border-color .12s}
.qb:hover{color:var(--text);border-color:var(--sub)}
.qb .ic{font-size:12px}

body.m8 .badge{border-color:var(--accent);color:var(--accent)}
/* ---- Recherche ---- */
#f{margin:28px 0 26px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;height:58px;padding:0 8px 0 20px;transition:border-color .15s,box-shadow .15s}
#f:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.ic{font-family:"Segoe Fluent Icons","Segoe MDL2 Assets";color:var(--sub);font-size:16px}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:17px;font-family:inherit;height:100%;padding-left:6px}
input::placeholder{color:var(--sub)}
select{border:0;background:var(--card2);color:var(--text);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13px;cursor:pointer;outline:0}
select option{background:var(--card);color:var(--text)}

/* ---- Grille ---- */
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.card-t{font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:2.5px;text-transform:uppercase}
.card-s{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{color:var(--sub);font-size:12px;cursor:pointer;border:0;background:none;font-family:inherit;padding:4px 6px;border-radius:6px}
.link:hover{color:var(--text);background:var(--card2)}

/* ---- Matchs ---- */
.match{display:grid;grid-template-columns:92px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px;border-radius:12px;
  background:var(--card2);margin-bottom:8px;border:1px solid transparent;transition:border-color .12s,transform .12s}
.match:hover{border-color:var(--line);transform:translateY(-1px)}
.m-when .d{color:var(--sub);font-size:12px;text-transform:capitalize}
.m-when .t{font-family:var(--head);font-size:22px;font-weight:600;letter-spacing:.5px}
.m-when .t .tbd{display:block;font-size:12px;font-weight:400;letter-spacing:0;line-height:1.2;color:var(--accent)}
.m-vs{display:flex;align-items:center;gap:10px;font-family:var(--head);font-size:18px;font-weight:700;min-width:0}
.m-vs .team{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-vs .gm{color:var(--text)}
.m-vs .opp{color:var(--sub)}
.m-vs .v{font-size:11px;color:var(--sub);letter-spacing:1px;flex:none}
.m-meta{grid-column:2;display:flex;gap:8px;align-items:center;color:var(--sub);font-size:12px;min-width:0;margin-top:-6px}
.m-meta .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game{font-family:var(--head);font-size:10px;font-weight:700;letter-spacing:1.2px;padding:3px 7px;border-radius:5px;flex:none;color:#fff}
.g-valorant{background:#d6404e}.g-valorantgc{background:#b4387a}.g-callofduty{background:#4c7a3a}.g-warzone{background:#6b6f2a}
.g-rocketleague{background:#2f6fd6}.g-fortnite{background:#7a4cc7}.g-ageofempires{background:#9a6a2a}
.m-act{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:var(--sub)}
.btn.main{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.btn.icon{padding:5px 8px}
.btn.off{opacity:.45}
.tours{color:var(--sub);font-size:12px;margin:4px 2px 2px;line-height:1.6}
.tours a{color:var(--text)}
.settings{display:none;background:var(--card2);border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px}
.settings.open{display:block}
.settings .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.gchip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--text)}
.gchip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}

/* ---- Lives ---- */
.lives{margin-top:18px}
.lv-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lv-tools input{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 12px;font-family:inherit;font-size:13px;outline:0;width:200px}
.lv-tools input:focus{border-color:var(--accent)}
.lv-in{position:relative}
.lv-sugg{position:absolute;right:0;top:calc(100% + 6px);width:290px;max-width:80vw;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;z-index:20;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.lv-sugg[hidden]{display:none}
.lv-s{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer}
.lv-s:hover,.lv-s.on{background:var(--card2)}
.lv-s img,.lv-s .av{width:30px;height:30px;border-radius:50%;flex:none;background:var(--card2);object-fit:cover}
.lv-s .t{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.25}
.lv-s .t b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-s .t span{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-s .lb{font-size:10px;font-weight:700;color:#fff;background:#e5484d;border-radius:5px;padding:2px 5px;flex:none}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.ch{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--card2);border:1px solid transparent;cursor:pointer;position:relative;min-width:0}
.ch:hover{border-color:var(--line)}
.ch.off{opacity:.6}
.av{width:42px;height:42px;border-radius:50%;flex:none;background:var(--card);border:2px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700}
.ch.live .av{border-color:var(--live)}
.av img{width:100%;height:100%;object-fit:cover}
.ci{min-width:0;flex:1}
.cn{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs .lv{color:var(--live);font-weight:700}
.ca{display:flex;gap:2px;flex:none;opacity:0;transition:opacity .12s}
.ch:hover .ca{opacity:1}
.ca button{border:0;background:none;color:var(--sub);cursor:pointer;font-size:14px;padding:3px 5px;border-radius:6px}
.ca button:hover{background:var(--card);color:var(--text)}
.ca button.on{color:var(--text)}
.err{color:var(--live);font-size:12px;margin-top:6px}
.cd{grid-row:1 / span 2;grid-column:3;font-size:12px;color:var(--sub);text-align:right;white-space:nowrap}
.cd .live{color:var(--live);font-weight:700;letter-spacing:1px;display:inline-flex;align-items:center;gap:6px}
.cd .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.empty{color:var(--sub);font-size:14px;padding:18px 6px 10px;line-height:1.5}
.skel{height:62px;border-radius:12px;background:linear-gradient(90deg,var(--card2),var(--line),var(--card2));background-size:200% 100%;animation:sk 1.4s infinite;margin-bottom:8px}
@keyframes sk{to{background-position:-200% 0}}
.credit{color:var(--sub);font-size:11px;margin-top:6px;opacity:.8}
.credit a{text-decoration:underline}

/* ---- Prières ---- */
.next{background:var(--card2);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.next .l{color:var(--sub);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.next .n{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.next .name{font-family:var(--head);font-size:28px;font-weight:700}
.next .time{font-family:var(--head);font-size:28px;font-weight:300}
.next .in{color:var(--sub);font-size:13px;margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.next .in b{color:var(--text);font-weight:600}
.next.soon{background:var(--accent);color:var(--accent-text)}
.next.soon .l,.next.soon .in,.next.soon .in b{color:var(--accent-text)}
.next.soon .bar{background:rgba(0,0,0,.18)}.next.soon .bar i{background:var(--accent-text)}
.bar{height:4px;border-radius:4px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.pfoot .credit{margin:0}
.prow{display:flex;justify-content:space-between;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
.prow:last-child{border-bottom:0}
.prow.past{color:var(--sub)}
.prow.minor{color:var(--sub);font-size:13px}
.prow.is-next{font-weight:700}
.prow.is-next span:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
.prow .tm{font-family:var(--head);font-variant-numeric:tabular-nums}

/* ---- Raccourcis ---- */
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px 9px;border-radius:12px;color:var(--text);font-size:12px;transition:background .12s;min-width:0}
.tile:hover{background:var(--card2)}
.fav{width:48px;height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:19px;overflow:hidden}
.fav img{width:24px;height:24px}
.name{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{text-align:center;color:var(--sub);font-size:12px;margin-top:26px}
kbd{font-family:inherit;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

@media (max-width:900px){.grid{grid-template-columns:1fr}.clock{font-size:48px}}
@media (max-width:520px){.wrap{padding:22px 14px 50px}.match{grid-template-columns:70px minmax(0,1fr)}.cd{grid-row:auto;grid-column:2;text-align:left}.brand-name{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="badge">M8</div>
      <div><div class="brand-name">Gentle Mates</div><div class="brand-sub">LiteBrowser · édition fan</div></div>
    </div>
    <div class="when"><div class="clock" id="clock"></div><div class="date" id="date"></div>
      <div class="quick">
        <button class="qb" data-open="historique" title="Historique (Ctrl+H)"><span class="ic">&#xE81C;</span>Historique</button>
        <button class="qb" data-open="" title="Réglages (Ctrl+,)"><span class="ic">&#xE713;</span>Réglages</button>
      </div></div>
  </header>

  <form id="f" autocomplete="off">
    <span class="ic">&#xE721;</span>
    <input id="q" placeholder="Rechercher sur le web ou saisir une adresse" autofocus>
    <select id="eng" title="Moteur de recherche"></select>
  </form>

  <div class="grid">
    <section class="card">
      <div class="card-h">
        <div class="card-t">Matchs Gentle Mates</div>
        <div style="display:flex;align-items:center;gap:6px;min-width:0">
          <span class="card-s" id="mstatus"></span>
          <button class="link" id="mset" title="Alertes et jeux suivis">&#x2699;</button>
          <button class="link" id="mrefresh" title="Actualiser">&#x21bb;</button>
        </div>
      </div>
      <div class="settings" id="settings">
        <div class="row"><label><input type="checkbox" id="snotify"> Alerte Windows avant chaque match</label>
          <select id="sreminder" title="Combien de temps avant ?">
            <option value="0">au coup d'envoi</option><option value="5">5 min avant</option><option value="15">15 min avant</option>
            <option value="30">30 min avant</option><option value="60">1 h avant</option></select></div>
        <div class="row" id="sgames"></div>
      </div>
      <div id="matches"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
      <div class="tours" id="tours"></div>
      <div class="credit">Données : <a href="https://liquipedia.net/">Liquipedia</a> (CC BY-SA)</div>
    </section>

    <div class="side">
      <aside class="card">
        <div class="card-h">
          <div class="card-t">Prières</div>
          <button class="link" id="city" title="Ville, mosquée, ajustements…">…</button>
        </div>
        <div id="prayers"><div class="skel"></div><div class="skel" style="height:180px"></div></div>
      </aside>
      <section class="card">
        <div class="card-h"><div class="card-t">Raccourcis</div><button class="link" data-open="favoris" title="Gérer les favoris">Gérer</button></div>
        <div class="tiles" id="tiles"></div>
      </section>
    </div>
  </div>

  <section class="card lives">
    <div class="card-h">
      <div class="card-t">Lives</div>
      <form class="lv-tools" id="lvadd" autocomplete="off">
        <button type="button" class="btn" id="lvfilter" title="Afficher seulement les chaînes en live">Tous</button>
        <button type="button" class="btn main" id="lvall" title="Ouvrir toutes les chaînes en live dans le multistream">Tout regarder</button>
        <span class="lv-in"><input id="lvin" placeholder="+ Ajouter (nom Twitch ou lien)"><div class="lv-sugg" id="lvsugg" hidden></div></span>
      </form>
    </div>
    <div class="chs" id="chs"></div>
    <div class="err" id="lverr"></div>
  </section>

  <div class="hint"><kbd>Ctrl+T</kbd> nouvel onglet &nbsp;·&nbsp; <kbd>Ctrl+Maj+N</kbd> onglet privé &nbsp;·&nbsp; <kbd>Ctrl+D</kbd> favori &nbsp;·&nbsp; <kbd>Ctrl+H</kbd> historique &nbsp;·&nbsp; <kbd>Ctrl+,</kbd> réglages</div>
</div>

<script>
const $ = id => document.getElementById(id);
const post = m => { if (window.chrome && chrome.webview) chrome.webview.postMessage(m); };
let state = null;

const pad = n => String(n).padStart(2, '0');
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
function dayLabel(d) {
  const t = new Date(); t.setHours(0,0,0,0);
  const x = new Date(d); x.setHours(0,0,0,0);
  const diff = Math.round((x - t) / 86400000);
  if (diff === 0) return "aujourd'hui";
  if (diff === 1) return 'demain';
  return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
}
function until(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 1) return "maintenant";
  if (m < 60) return 'dans ' + m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return 'dans ' + h + ' h' + (r ? ' ' + pad(r) : '');
  const d = Math.round(h / 24);
  return 'dans ' + d + ' jour' + (d > 1 ? 's' : '');
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- Horloge ----------
function tick() {
  const d = new Date();
  $('clock').textContent = hm(d);
  let txt = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  if (state && state.prayers && state.prayers.hijri) txt += ' · ' + state.prayers.hijri;
  $('date').textContent = txt;
  if (state) { renderMatches(); renderPrayers(); renderLives(); }
}

// ---------- Recherche ----------
$('f').addEventListener('submit', e => { e.preventDefault(); const v = $('q').value.trim(); if (v) post({ type: 'search', q: v }); });
$('eng').addEventListener('change', () => { post({ type: 'engine', id: $('eng').value }); placeholder(); });
function placeholder() { const o = $('eng').options[$('eng').selectedIndex]; $('q').placeholder = 'Rechercher avec ' + (o ? o.text : 'le web') + ' ou saisir une adresse'; }
$('city').addEventListener('click', () => post({ type: 'city' }));
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o) { e.preventDefault(); post({ type: 'openSettings', section: o.dataset.open || null }); }
});
$('mrefresh').addEventListener('click', () => post({ type: 'refreshMatches' }));

// ---------- Matchs ----------
function renderMatches() {
  const m8 = state.m8 || {}, box = $('matches'), list = m8.matches || [];
  $('mstatus').textContent = m8.loading ? 'Mise à jour…' : (m8.updated ? 'Mis à jour à ' + hm(new Date(m8.updated)) + (m8.source === 'Nur Live' ? ' (Nur Live)' : '') : '');
  // réglages
  $('snotify').checked = !!m8.notify;
  $('sreminder').value = String(m8.reminder ?? 15);
  $('sgames').innerHTML = (m8.games || []).map(g => `<button class="gchip ${g.on ? 'on' : ''}" data-game="${esc(g.id)}">${esc(g.label)}</button>`).join('');
  // tournois annoncés
  const tours = m8.tournaments || [];
  $('tours').innerHTML = tours.length ? 'À venir : ' + tours.map(t => `<a href="${esc(t.url)}">${esc(t.name)}</a> <span>(${esc(t.game)}, ${esc(t.when)})</span>`).join(' · ') : '';
  if (!list.length) {
    box.innerHTML = m8.loading && !m8.updated
      ? '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'
      : '<div class="empty">Aucun match de Gentle Mates programmé pour le moment.<br>Les nouveaux matchs apparaîtront ici, avec une alerte avant le coup d\'envoi.</div>';
    return;
  }
  const now = Date.now();
  box.innerHTML = list.slice(0, 8).map(x => {
    const d = new Date(x.ts * 1000);
    const live = !x.timeUnknown && (x.status === 'live' || d.getTime() <= now);
    return `<a class="match" href="${esc(x.url || '#')}" title="Voir sur Liquipedia">
      <div class="m-when"><div class="d">${esc(dayLabel(d))}</div><div class="t">${x.timeUnknown ? '<span class="tbd">horaire à venir</span>' : hm(d)}</div></div>
      <div class="m-vs"><span class="team gm">M8</span><span class="v">VS</span><span class="team opp" title="${esc(x.opp)}">${esc(x.oppShort || x.opp)}</span></div>
      <div class="cd">${live ? '<span class="live">EN DIRECT</span>' : x.timeUnknown ? 'alerte dès que l\'heure est connue' : until(d - now)}
        <div class="m-act">
          ${x.timeUnknown ? '' : `<button class="btn icon ${x.muted ? 'off' : ''}" data-mute="${esc(x.id)}" title="${x.muted ? 'Réactiver l\'alerte de ce match' : 'Couper l\'alerte de ce match'}">${x.muted ? '🔕' : '🔔'}</button>`}
          <button class="btn main" data-watch="${esc(x.id)}" title="Ouvre la co-diffusion M8 en live, sinon la diffusion officielle">Regarder</button>
        </div></div>
      <div class="m-meta"><span class="game g-${esc(x.game)}" title="${esc(x.gameLabel)}">${esc(x.gameShort)}</span>
        <span class="tn">${esc(x.tournament || x.gameLabel)}${x.stage ? ' · ' + esc(x.stage) : ''}${x.score ? ' · ' + esc(x.score) : ''}</span></div>
    </a>`;
  }).join('');
}
$('matches').addEventListener('click', e => {
  const w = e.target.closest('[data-watch]'), m = e.target.closest('[data-mute]');
  if (w) { e.preventDefault(); post({ type: 'watchMatch', id: w.dataset.watch }); }
  else if (m) { e.preventDefault(); post({ type: 'muteMatch', id: m.dataset.mute }); }
});
$('mset').addEventListener('click', () => $('settings').classList.toggle('open'));
$('snotify').addEventListener('change', () => post({ type: 'm8Settings', notify: $('snotify').checked }));
$('sreminder').addEventListener('change', () => post({ type: 'm8Settings', reminder: +$('sreminder').value }));
$('sgames').addEventListener('click', e => { const g = e.target.closest('[data-game]'); if (g) post({ type: 'm8Settings', toggleGame: g.dataset.game }); });

// ---------- Lives ----------
let liveOnly = false;
function renderLives() {
  const all = (state.channels || []).slice().sort((a, b) =>
    ((b.live === true) - (a.live === true)) || ((b.fav === true) - (a.fav === true)) || (b.viewers - a.viewers) || String(a.name).localeCompare(String(b.name)));
  const list = liveOnly ? all.filter(c => c.live === true) : all;
  const nLive = all.filter(c => c.live === true).length;
  $('lvfilter').textContent = liveOnly ? `En live (${nLive})` : `Tous (${all.length})`;
  $('lvfilter').classList.toggle('main', liveOnly);
  $('lvall').disabled = !nLive;
  $('lvall').classList.toggle('off', !nLive);
  $('chs').innerHTML = list.length ? list.map(c => {
    const initial = esc(String(c.name || c.key).charAt(0).toUpperCase());
    const status = c.live === true
      ? `<span class="lv">● ${c.viewers ? c.viewers.toLocaleString('fr-FR') : 'EN LIVE'}</span>${c.game ? ' · ' + esc(c.game) : ''}`
      : c.live === false ? 'Hors ligne' : (c.platform === 'youtube' ? 'YouTube' : 'Statut inconnu');
    return `<div class="ch ${c.live === true ? 'live' : c.live === false ? 'off' : ''}" data-id="${esc(c.id)}" title="${esc(c.title || '')}">
      <div class="av">${c.avatar ? `<img src="${esc(c.avatar)}" alt="" onerror="this.parentNode.textContent='${initial}'">` : initial}</div>
      <div class="ci"><div class="cn">${esc(c.name || c.label)}${c.fav ? ' ★' : ''}</div><div class="cs">${status}</div>
        ${c.live === true && c.title ? `<div class="cs">${esc(c.title)}</div>` : ''}</div>
      <div class="ca">
        <button class="${c.fav ? 'on' : ''}" data-act="toggleFav" title="Favori">${c.fav ? '★' : '☆'}</button>
        <button class="${c.notify ? 'on' : ''}" data-act="toggleNotify" title="${c.notify ? 'Ne plus prévenir' : 'Me prévenir quand il lance son live'}">${c.notify ? '🔔' : '🔕'}</button>
        <button data-act="removeChannel" title="Retirer">✕</button>
      </div></div>`;
  }).join('') : `<div class="empty">${liveOnly ? 'Personne n\'est en live parmi tes chaînes.' : 'Ajoute tes chaînes (nom Twitch, ou lien Twitch / Kick / YouTube).'}</div>`;
}
$('chs').addEventListener('click', e => {
  const card = e.target.closest('.ch'); if (!card) return;
  const act = e.target.closest('[data-act]');
  if (act) post({ type: act.dataset.act, id: card.dataset.id });
  else post({ type: 'watch', ids: [card.dataset.id] });
});
$('lvfilter').addEventListener('click', () => { liveOnly = !liveOnly; renderLives(); });
$('lvall').addEventListener('click', () => {
  const ids = (state.channels || []).filter(c => c.live === true).sort((a, b) => (b.fav - a.fav) || (b.viewers - a.viewers)).slice(0, 6).map(c => c.id);
  if (ids.length) post({ type: 'watch', ids });
});
// suggestions de chaînes pendant la frappe
let sugg = [], suggSel = -1, suggTimer = 0;
const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace('.', ',') + ' k' : String(n || 0);
function hideSugg() { sugg = []; suggSel = -1; $('lvsugg').hidden = true; }
function renderSugg() {
  const known = new Set((state.channels || []).map(c => c.id));
  const list = sugg.filter(h => !known.has('twitch:' + h.key)).slice(0, 6);
  if (!list.length || document.activeElement !== $('lvin')) { $('lvsugg').hidden = true; return; }
  $('lvsugg').innerHTML = list.map((h, i) => `<div class="lv-s${i === suggSel ? ' on' : ''}" data-key="${esc(h.key)}">` +
    (h.avatar ? `<img src="${esc(h.avatar)}" alt="">` : '<span class="av"></span>') +
    `<div class="t"><b>${esc(h.name)}</b><span>${h.live ? 'En live · ' + fmtN(h.viewers) + (h.game ? ' · ' + esc(h.game) : '') : fmtN(h.followers) + ' abonnés'}</span></div>` +
    (h.live ? '<b class="lb">LIVE</b>' : '') + '</div>').join('');
  $('lvsugg').hidden = false;
}
function pickSugg(key) {
  $('lverr').textContent = '';
  post({ type: 'addChannel', input: key, fav: true });
  $('lvin').value = ''; hideSugg();
}
$('lvin').addEventListener('input', () => {
  clearTimeout(suggTimer);
  const q = $('lvin').value.trim();
  if (q.length < 2 || /[\s,;:/.]/.test(q)) { hideSugg(); return; }
  suggTimer = setTimeout(() => post({ type: 'searchChannels', q }), 280);
});
$('lvin').addEventListener('keydown', e => {
  const n = $('lvsugg').querySelectorAll('.lv-s').length;
  if (!n || $('lvsugg').hidden) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    suggSel = (suggSel + (e.key === 'ArrowDown' ? 1 : n - 1) + (suggSel < 0 && e.key === 'ArrowUp' ? 1 : 0)) % n;
    renderSugg();
  } else if (e.key === 'Enter' && suggSel >= 0) {
    e.preventDefault();
    pickSugg($('lvsugg').querySelectorAll('.lv-s')[suggSel].dataset.key);
  } else if (e.key === 'Escape') hideSugg();
});
$('lvin').addEventListener('blur', () => setTimeout(() => { $('lvsugg').hidden = true; }, 150));
$('lvin').addEventListener('focus', renderSugg);
$('lvsugg').addEventListener('mousedown', e => {
  const r = e.target.closest('.lv-s'); if (!r) return;
  e.preventDefault(); pickSugg(r.dataset.key);
});
$('lvadd').addEventListener('submit', e => {
  e.preventDefault();
  hideSugg();
  const v = $('lvin').value.trim(); if (!v) return;
  $('lverr').textContent = '';
  post({ type: 'addChannel', input: v, fav: true });
  $('lvin').value = '';
});

// ---------- Prières ----------
function renderPrayers() {
  const p = state.prayers, box = $('prayers');
  if (!p || !p.times || !p.times.length) {
    $('city').textContent = p && p.city ? p.city : 'Choisir ma ville';
    box.innerHTML = '<div class="empty">' + (p && p.error ? esc(p.error) : 'Recherche de ta position…') + '</div>';
    return;
  }
  $('city').textContent = (p.city || 'Ma ville') + ' ▾';
  const now = new Date(), base = new Date(); base.setHours(0,0,0,0);
  const times = p.times.map(t => { const [h, mi] = t.time.split(':').map(Number); const d = new Date(base); d.setHours(h, mi, 0, 0); return { ...t, d }; });
  const five = times.filter(t => t.key !== 'Sunrise');
  let next = five.find(t => t.d > now);
  let nextAt = next ? next.d : null;
  if (!next) { next = five[0]; nextAt = new Date(next.d.getTime() + 86400000); }
  // progression depuis la prière précédente (Isha d'hier si on est avant Fajr)
  const prev = [...five].reverse().find(t => t.d <= now);
  const prevAt = prev ? prev.d : new Date(five[five.length - 1].d.getTime() - 86400000);
  const pct = Math.max(2, Math.min(100, Math.round((now - prevAt) / (nextAt - prevAt) * 100)));
  const soon = nextAt - now < 15 * 60000;
  const remind = [p.notify ? 'Notification à l\'heure' : '', p.reminder ? 'rappel ' + p.reminder + ' min avant' : ''].filter(Boolean).join(' · ') || 'Alertes coupées';
  const tomorrow = nextAt.getDate() !== now.getDate();
  box.innerHTML = `
    <div class="next ${soon ? 'soon' : ''}"><div class="l">Prochaine prière${tomorrow ? ' · demain' : ''}</div>
      <div class="n"><span class="name">${esc(next.name)}</span><span class="time">${hm(nextAt)}</span></div>
      <div class="in"><b>${until(nextAt - now)}</b><span>${prev ? 'depuis ' + esc(prev.name) : ''}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>
    ${times.map(t => `<div class="prow ${t.key === 'Sunrise' ? 'minor' : ''} ${t.key === next.key && !tomorrow ? 'is-next' : (t.d < now ? 'past' : '')}">
        <span>${esc(t.name)}</span><span class="tm">${esc(t.time)}</span></div>`).join('')}
    ${p.jumua ? `<div class="prow minor"><span>Jumu'a (vendredi)</span><span class="tm">${esc(p.jumua)}</span></div>` : ''}
    <div class="pfoot"><div class="credit">${esc(p.methodName || '')}</div>
      <button class="link" data-open="prieres" title="Notifications et rappels des prières">${esc(remind)}</button></div>`;
}

// ---------- Raccourcis ----------
function renderTiles() {
  const tiles = $('tiles'); tiles.innerHTML = '';
  for (const t of state.tiles || []) {
    let host = ''; try { host = new URL(t.url).hostname; } catch {}
    const a = document.createElement('a'); a.className = 'tile'; a.href = t.url; a.title = t.url;
    const fv = document.createElement('div'); fv.className = 'fav';
    const img = new Image(); img.alt = '';
    img.onerror = () => { fv.textContent = (t.title || host || '?').charAt(0).toUpperCase(); };
    img.src = 'https://icons.duckduckgo.com/ip3/' + host + '.ico';
    fv.appendChild(img);
    const n = document.createElement('div'); n.className = 'name'; n.textContent = t.title;
    a.append(fv, n); tiles.appendChild(a);
  }
}

function render(d) {
  if (d.type === 'error') { $('lverr').textContent = d.text; return; }
  if (d.type === 'added') return;
  if (d.type === 'channelHits') {
    if (d.q === $('lvin').value.trim()) { sugg = d.hits || []; suggSel = -1; renderSugg(); }
    return;
  }
  const first = !state;
  state = Object.assign(state || {}, d);
  document.body.classList.remove('dark', 'light', 'm8');
  document.body.classList.add(state.theme || 'm8');
  if (d.engines) {
    const eng = $('eng'); eng.innerHTML = '';
    for (const e of d.engines) { const o = new Option(e.name, e.id); o.selected = e.id === d.engine; eng.add(o); }
    placeholder();
  }
  if (d.tiles) renderTiles();
  tick();
  if (first) $('q').focus();
}

tick(); setInterval(tick, 15000);
if (window.chrome && chrome.webview) {
  chrome.webview.addEventListener('message', e => render(e.data));
  post({ type: 'ready' });
}
$('q').focus();
</script>
</body>
