name: Publier une version

# À chaque envoi sur main : si le numéro <Version> du projet n'a pas encore de release,
# compile LiteBrowser sur Windows et publie la release avec LiteBrowser.exe.
# Tous les navigateurs installés la téléchargent ensuite automatiquement.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$proj = Get-Content LiteBrowser.csproj
          $version = ($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "v$version déjà publiée, rien à faire." }
          else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          dotnet-version: '8.0.x'

      - name: Compiler
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          dotnet publish LiteBrowser.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out

      - name: Publier la release
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" out/LiteBrowser.exe `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "LiteBrowser ${{ steps.ver.outputs.version }}" --generate-notes
