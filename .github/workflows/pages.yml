name: Pages Liquipedia (diagnostic)
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="LiteBrowser/3.1 (https://github.com/Atlantaas/LiteBrowser)"
          for w in rocketleague valorant; do
            curl -s --compressed -A "$UA" "https://liquipedia.net/$w/api.php?action=parse&format=json&prop=text&page=Liquipedia:Matches" -o out/m_$w.json -w "$w %{http_code} %{size_download}\n"
            sleep 35
          done
      - uses: actions/upload-artifact@v4
        with: { name: pages, path: out }
