name: Pages Liquipedia (diagnostic)
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="LiteBrowser/3.1 (https://github.com/Atlantaas/LiteBrowser)"
          for p in "rocketleague/Gentle_Mates" "rocketleague/NEO/Coupe_de_France_Slash/2026" "rocketleague/Liquipedia:Matches"; do
            f=out/$(echo "$p" | tr '/:' '__').html
            curl -s --compressed -A "$UA" "https://liquipedia.net/$p" -o "$f" -w "$p %{http_code} %{size_download}\n"
            sleep 35
          done
      - uses: actions/upload-artifact@v4
        with: { name: pages, path: out }
