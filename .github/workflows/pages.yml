name: Pages Liquipedia (diagnostic)
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="LiteBrowser/3.1 (https://github.com/Atlantaas/LiteBrowser)"
          for w in rocketleague valorant callofduty fortnite; do
            curl -s --compressed -A "$UA" "https://liquipedia.net/$w/api.php?action=query&format=json&generator=backlinks&gbltitle=Gentle_Mates&gblnamespace=0&gbllimit=500&prop=revisions&rvprop=timestamp" -o out/bl_$w.json -w "$w %{http_code} %{size_download}\n"
            sleep 3
          done
      - uses: actions/upload-artifact@v4
        with: { name: pages, path: out }
