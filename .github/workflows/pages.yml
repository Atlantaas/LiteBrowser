name: Pages Liquipedia (diagnostic)
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; UA="LiteBrowser/3.1 (https://github.com/Atlantaas/LiteBrowser)"
          for p in "Gentle_Mates" "NEO/Coupe_de_France_Slash/2026"; do
            f=out/$(echo "$p" | tr '/:' '__').json
            curl -s --compressed -A "$UA" "https://liquipedia.net/rocketleague/api.php?action=parse&format=json&prop=text&page=$p" -o "$f" -w "$p %{http_code} %{size_download}\n"
            sleep 35
          done
      - uses: actions/upload-artifact@v4
        with: { name: pages, path: out }
